<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status Board</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 28px 18px;
    }

    .wrap,
    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    main {
      padding: 20px 14px 48px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    .subtitle {
      margin: 0;
      color: #d1d5db;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.04);
    }

    .metric {
      font-size: 28px;
      font-weight: 750;
      margin-top: 6px;
    }

    .label,
    .muted {
      color: #6b7280;
    }

    section {
      margin-top: 18px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 11px 10px;
      border-bottom: 1px solid #e5e7eb;
      vertical-align: top;
    }

    th {
      font-size: 13px;
      color: #6b7280;
      background: #f9fafb;
    }

    .pill {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 12px;
      background: #eef2ff;
      color: #3730a3;
      white-space: nowrap;
    }

    .done {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      color: #b91c1c;
      background: #fee2e2;
      border: 1px solid #fecaca;
      padding: 12px;
      border-radius: 12px;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: #6b7280;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }
    }

    @media (max-width: 520px) {
      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Status Board</h1>
      <p class="subtitle">Shared status view</p>
    </div>
  </header>

  <main>
    <div id="status" class="card">Loading...</div>
    <div id="app" style="display:none"></div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzgOttUVUHomtvKCECBID-9Ly1bSoXfkGk8PEXqI5lEUmuIj47il4W_egdLPaSmof68/exec";

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function asArray(value, key) {
      if (Array.isArray(value)) return value;
      if (value && Array.isArray(value[key])) return value[key];
      return [];
    }

    function stateClass(value) {
      const s = String(value || "").toLowerCase();
      return s === "done" || s === "completed" ? "pill done" : "pill";
    }

    function loadJsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = "statusBoardCallback_" + Date.now();

        window[callbackName] = function(payload) {
          delete window[callbackName];
          script.remove();
          resolve(payload);
        };

        const script = document.createElement("script");
        const separator = url.includes("?") ? "&" : "?";
        script.src = url + separator + "view=normal&callback=" + callbackName;

        script.onerror = function() {
          delete window[callbackName];
          script.remove();
          reject(new Error("Could not load data."));
        };

        document.body.appendChild(script);
      });
    }

    function getItems(data) {
      return asArray(data.items || data.tasks || data.approved_tasks || [], "items");
    }

    function getPeople(data) {
      return asArray(data.contributors || data.members || [], "contributors");
    }

    function getAreas(data) {
      return asArray(data.areas || data.categories || [], "areas");
    }

    function getUpdates(data) {
      return asArray(data.updates || data.reports || [], "updates");
    }

    function getExtra(data) {
      return asArray(data.extra || data.components || data.reimbursements || [], "extra");
    }

    function render(payload) {
      if (!payload || !payload.ok) {
        throw new Error(payload && payload.error ? payload.error : "Data source returned an error.");
      }

      const data = payload.data || {};

      const items = getItems(data);
      const people = getPeople(data);
      const areas = getAreas(data);
      const updates = getUpdates(data);
      const extra = getExtra(data);

      const completedItems = items.filter(item => {
        const state = String(item.state || item.status || "").toLowerCase();
        return state === "done" || state === "completed";
      }).length;

      const totalPoints = items.reduce((sum, item) => {
        return sum + Number(item.points ?? item.weight ?? 0);
      }, 0);

      const lastUpdate =
        data.last_update ||
        data.generated_at ||
        data.exported_at ||
        data.updated_at ||
        payload.served_at ||
        "unknown";

      const itemRows = items.length
        ? items.map(item => `
          <tr>
            <td>${escapeHtml(item.public_id || item.item_id || item.task_id || item.id || "")}</td>
            <td>${escapeHtml(item.label || item.title || item.task || "")}</td>
            <td><span class="${stateClass(item.state || item.status)}">${escapeHtml(item.state || item.status || "")}</span></td>
            <td>${escapeHtml(item.owner || item.work_done_by || item.member || "")}</td>
            <td>${escapeHtml(item.area || item.category_name || item.category_id || item.category || "")}</td>
            <td>${escapeHtml(item.points ?? item.weight ?? "")}</td>
          </tr>
        `).join("")
        : `<tr><td colspan="6" class="muted">No visible items yet.</td></tr>`;

      const peopleRows = people.length
        ? people.map(person => `
          <tr>
            <td>${escapeHtml(person.label || person.name || person.display_name || person.id || "")}</td>
            <td>${escapeHtml(person.state || person.status || "")}</td>
            <td>${escapeHtml(person.items_count ?? person.tasks_count ?? person.task_count ?? "")}</td>
            <td>${escapeHtml(person.total_points ?? person.total_weight ?? "")}</td>
          </tr>
        `).join("")
        : `<tr><td colspan="4" class="muted">No contributor summary available.</td></tr>`;

      const areaRows = areas.length
        ? areas.map(area => `
          <tr>
            <td>${escapeHtml(area.label || area.name || area.title || area.id || "")}</td>
            <td>${escapeHtml(area.kind || area.type || "")}</td>
            <td>${escapeHtml(area.items_count ?? area.tasks_count ?? area.task_count ?? "")}</td>
            <td>${escapeHtml(area.total_points ?? area.total_weight ?? "")}</td>
          </tr>
        `).join("")
        : `<tr><td colspan="4" class="muted">No area summary available.</td></tr>`;

      const extraRows = extra.length
        ? extra.map(item => `
          <tr>
            <td>${escapeHtml(item.public_id || item.id || item.component_id || "")}</td>
            <td>${escapeHtml(item.label || item.title || item.name || "")}</td>
            <td>${escapeHtml(item.owner || item.member_name || item.reported_by || "")}</td>
            <td>${escapeHtml(item.state || item.status || "")}</td>
          </tr>
        `).join("")
        : `<tr><td colspan="4" class="muted">No additional visible items yet.</td></tr>`;

      document.getElementById("app").innerHTML = `
        <div class="grid">
          <div class="card">
            <div class="label">Visible items</div>
            <div class="metric">${items.length}</div>
          </div>
          <div class="card">
            <div class="label">Completed items</div>
            <div class="metric">${completedItems}</div>
          </div>
          <div class="card">
            <div class="label">Total points</div>
            <div class="metric">${totalPoints}</div>
          </div>
          <div class="card">
            <div class="label">Updates recorded</div>
            <div class="metric">${updates.length}</div>
          </div>
        </div>

        <section class="card">
          <h2>Current Items</h2>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Item</th>
                <th>State</th>
                <th>Owner</th>
                <th>Area</th>
                <th>Points</th>
              </tr>
            </thead>
            <tbody>${itemRows}</tbody>
          </table>
        </section>

        <section class="card">
          <h2>Contributor Overview</h2>
          <table>
            <thead>
              <tr>
                <th>Contributor</th>
                <th>State</th>
                <th>Items</th>
                <th>Points</th>
              </tr>
            </thead>
            <tbody>${peopleRows}</tbody>
          </table>
        </section>

        <section class="card">
          <h2>Areas</h2>
          <table>
            <thead>
              <tr>
                <th>Area</th>
                <th>Kind</th>
                <th>Items</th>
                <th>Points</th>
              </tr>
            </thead>
            <tbody>${areaRows}</tbody>
          </table>
        </section>

        <section class="card">
          <h2>Additional Items</h2>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Item</th>
                <th>Owner</th>
                <th>State</th>
              </tr>
            </thead>
            <tbody>${extraRows}</tbody>
          </table>
        </section>

        <div class="footer">
          Last update: ${escapeHtml(lastUpdate)}
        </div>
      `;

      document.getElementById("status").style.display = "none";
      document.getElementById("app").style.display = "block";
    }

    loadJsonp(API_URL)
      .then(render)
      .catch(error => {
        document.getElementById("status").innerHTML =
          `<div class="error"><strong>Could not load the status board.</strong><br>${escapeHtml(error.message)}</div>`;
      });
  </script>
</body>
</html>
